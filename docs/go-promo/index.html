<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>אניפט מודיעין – מבצע GO! לווצאפ</title>
<style>
  :root{
    --bg:#f6f4ef; --card:#fff; --ink:#1e2a22; --muted:#6b756e; --line:#e6e2d8;
    --wa:#1fa855; --wa-d:#168a45; --accent:#e8792b; --sent:#eef7f0;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:16px}
  header{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;padding:14px 16px 12px}
  h1{margin:0;font-size:19px;font-weight:700}
  .sub{font-size:13px;opacity:.8;margin-top:2px}
  .bar{height:6px;background:rgba(255,255,255,.18);border-radius:3px;margin-top:10px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--wa);width:0;transition:width .3s}
  .controls{padding:12px 16px 4px;max-width:760px;margin:0 auto}
  input[type=search]{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:12px;font-size:16px;background:#fff}
  .chips{display:flex;gap:8px;margin-top:10px;overflow-x:auto;padding-bottom:4px}
  .chip{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;font-size:14px;color:var(--ink);cursor:pointer}
  .chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  details.msg{margin:10px 0 0;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px}
  details.msg summary{cursor:pointer;font-size:14px;color:var(--muted)}
  textarea{width:100%;min-height:96px;margin-top:8px;border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;font-size:15px;resize:vertical}
  .hint{font-size:12px;color:var(--muted);margin-top:4px}
  .reset{margin-top:8px;font-size:13px;background:none;border:none;color:var(--accent);cursor:pointer;padding:0}
  ul{list-style:none;margin:0 auto;padding:8px 16px 40px;max-width:760px}
  li{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;display:flex;align-items:center;gap:12px}
  li.sent{background:var(--sent);border-color:#cfe6d6}
  .info{flex:1;min-width:0}
  .name{font-weight:650;font-size:16px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .first{font-size:12px;color:var(--muted);font-weight:400;border:1px dashed #cfc9bb;border-radius:6px;padding:1px 6px;cursor:pointer;background:none}
  .meta{font-size:12.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tag{direction:ltr;unicode-bidi:isolate;font-size:11px;font-weight:600;padding:2px 7px;border-radius:6px;background:#fff1e6;color:#b2541a}
  .tag.or{background:#eef0ff;color:#3d47a8}
  a.wa{flex:none;display:flex;align-items:center;gap:7px;background:var(--wa);color:#fff;text-decoration:none;border-radius:12px;padding:9px 10px;font-weight:600;font-size:14px;direction:ltr}
  a.wa:active{background:var(--wa-d)}
  a.wa svg{width:18px;height:18px;fill:#fff}
  li.sent a.wa{background:#8fcaa3}
  .nowa{flex:none;font-size:13px;color:var(--muted);text-align:center;direction:ltr}
  .chk{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);background:#fff;display:grid;place-items:center;cursor:pointer;padding:0;color:#fff;font-size:15px}
  li.sent .chk{background:var(--wa);border-color:var(--wa)}
  .meta.wrap{white-space:normal}
  .empty{text-align:center;color:var(--muted);padding:30px}
  .edit{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:10;padding:20px}
  .edit.open{display:flex}
  .edit .box{background:#fff;border-radius:16px;padding:18px;width:100%;max-width:360px}
  .edit input{width:100%;padding:11px;font-size:16px;border:1px solid var(--line);border-radius:10px;margin:10px 0}
  .edit .row{display:flex;gap:8px;justify-content:flex-start}
  .btn{border:none;border-radius:10px;padding:10px 16px;font-size:15px;cursor:pointer}
  .btn.p{background:var(--ink);color:#fff}.btn.s{background:#eee}

  .lock{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;align-items:center;justify-content:center;padding:24px}
  .lock .box{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;width:100%;max-width:340px;text-align:center}
  .lock input{width:100%;padding:12px;font-size:17px;border:1px solid var(--line);border-radius:10px;margin:14px 0 10px;text-align:center}
  .lock .err{color:#c0392b;font-size:14px;min-height:18px}
  .lock .btn{width:100%}
</style>
</head>
<body>
<div class="lock" id="lock"><form class="box" id="lockForm">
  <div style="font-weight:700;font-size:18px">אניפט מודיעין</div>
  <div class="hint">הזינו סיסמה כדי לראות את רשימת הלקוחות</div>
  <input id="pw" type="password" autocomplete="current-password" placeholder="סיסמה">
  <div class="err" id="pwErr"></div>
  <button class="btn p" type="submit">כניסה</button>
</form></div>
<header>
  <h1>מבצע <bdi>GO!</bdi> – רשימת לקוחות מודיעין</h1>
  <div class="sub" id="stat"></div>
  <div class="bar"><i id="prog"></i></div>
</header>

<div class="controls">
  <input type="search" id="q" placeholder="חיפוש לפי שם או טלפון">
  <div class="chips" id="chips">
    <button class="chip on" data-f="all">הכל</button>
    <button class="chip" data-f="todo">עוד לא נשלח</button>
    <button class="chip" data-f="sent">נשלח</button>
    <button class="chip" data-f="go">קונים <bdi>GO!</bdi></button>
    <button class="chip" data-f="or">Orijen בלבד</button>
  </div>
  <details class="msg">
    <summary>נוסח ההודעה (לחצו לעריכה)</summary>
    <textarea id="tpl"></textarea>
    <div class="hint">{שם} יוחלף בשם הפרטי של כל לקוח.</div>
    <button class="reset" id="resetTpl">שחזור הנוסח המקורי</button>
  </details>
</div>

<ul id="list"></ul>

<div class="edit" id="edit">
  <div class="box">
    <div style="font-weight:650">שם לפנייה בהודעה</div>
    <div class="hint" id="editFull"></div>
    <input id="editInput" type="text">
    <div class="row">
      <button class="btn p" id="editSave">שמירה</button>
      <button class="btn s" id="editCancel">ביטול</button>
    </div>
  </div>
</div>

const DEFAULT_TPL = "היי {שם} זה מאניפט מודיעין, רצינו לספר לכם שיש לנו עד סוף היום בלבד מבצע, 20 אחוז הנחה על כל שקי המזון ממותג go! ניתן להזמין מאיתנו ישירות במשלוח או לבוא לחנות";
const KEY = "anipet-go-promo-v1";

let st = {sent:{}, names:{}, tpl:DEFAULT_TPL};
try { const s = JSON.parse(localStorage.getItem(KEY)); if (s) st = Object.assign(st, s); } catch(e){}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch(e){} };

let filter = "all";
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const firstOf = r => (r.n in st.names) ? st.names[r.n] : r.f;
const msgFor = r => {
  const f = firstOf(r).trim();
  return f ? st.tpl.replace("{שם}", f) : st.tpl.replace(" {שם}", "").replace("{שם}", "");
};
const fmtDate = d => { if (!d || d==="None") return ""; const [y,m,dd] = d.split("-"); return `${dd}/${m}/${y.slice(2)}`; };
const WA_ICON = '<svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.3 14.2c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.1-4.5-3.9-4.7-4.1-.1-.2-1.1-1.5-1.1-2.9s.7-2 1-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.4 0 .5l-.4.6-.4.4c-.1.2-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.4 2.4 1.5.3.2.5.1.7-.1l.9-1.1c.2-.3.4-.2.7-.1l2 1c.3.1.5.2.5.3.1.2.1.7-.1 1.4z"/></svg>';

function render(){
  const q = $("q").value.trim().replace(/-/g,"");
  const items = DATA.filter(r => {
    const sent = !!st.sent[r.n];
    if (filter==="todo" && sent) return false;
    if (filter==="sent" && !sent) return false;
    if (filter==="go" && !/GO/.test(r.b)) return false;
    if (filter==="or" && r.b!=="Orijen") return false;
    if (q && !(r.n.includes(q) || r.p.replace(/-/g,"").includes(q))) return false;
    return true;
  });
  $("list").innerHTML = items.length ? items.map(r => {
    const i = DATA.indexOf(r), sent = !!st.sent[r.n];
    const link = r.w ? `whatsapp://send?phone=${r.w}&text=${encodeURIComponent(msgFor(r))}` : "";
    const tag = r.b ? `<span class="tag ${r.b==="Orijen"?"or":""}">${esc(r.b)}</span>` : "";
    const meta = (fmtDate(r.l) ? `<div class="meta wrap">קנייה אחרונה <bdi>${fmtDate(r.l)}</bdi></div>` : "") + (r.i ? `<div class="meta">${esc(r.i)}</div>` : "");
    return `<li class="${sent?"sent":""}">
      <button class="chk" data-c="${i}" aria-label="סימון כנשלח">${sent?"✓":""}</button>
      <div class="info">
        <div class="name">${esc(r.n)} ${tag}
          <button class="first" data-e="${i}" title="שינוי השם שבהודעה">"היי ${esc(firstOf(r)) || "—"}" ✎</button></div>
        ${meta}
      </div>
      ${link ? `<a class="wa" href="${link}" data-s="${i}">${WA_ICON}${esc(r.p)}</a>`
             : `<div class="nowa">${esc(r.p)}<br>לא נייד</div>`}
    </li>`;
  }).join("") : `<div class="empty">אין לקוחות להצגה</div>`;
  const total = DATA.filter(r=>r.w).length;
  const done = DATA.filter(r=>r.w && st.sent[r.n]).length;
  $("stat").textContent = `${DATA.length} לקוחות · נשלחו ${done} מתוך ${total} מספרי נייד`;
  $("prog").style.width = (total ? done/total*100 : 0) + "%";
}

$("list").addEventListener("click", e => {
  const a = e.target.closest("[data-s]");
  if (a) { st.sent[DATA[a.dataset.s].n] = true; save(); setTimeout(render, 300); return; }
  const c = e.target.closest("[data-c]");
  if (c) { const n = DATA[c.dataset.c].n; if (st.sent[n]) delete st.sent[n]; else st.sent[n] = true; save(); render(); return; }
  const ed = e.target.closest("[data-e]");
  if (ed) openEdit(DATA[ed.dataset.e]);
});

let editing = null;
function openEdit(r){ editing = r; $("editFull").textContent = r.n + " · " + r.p; $("editInput").value = firstOf(r); $("edit").classList.add("open"); $("editInput").focus(); }
$("editCancel").onclick = () => $("edit").classList.remove("open");
$("editSave").onclick = () => { st.names[editing.n] = $("editInput").value.trim(); save(); $("edit").classList.remove("open"); render(); };
$("editInput").addEventListener("keydown", e => { if (e.key==="Enter") $("editSave").click(); });

$("chips").addEventListener("click", e => {
  const b = e.target.closest(".chip"); if (!b) return;
  filter = b.dataset.f;
  document.querySelectorAll(".chip").forEach(x => x.classList.toggle("on", x===b));
  render();
});
$("q").addEventListener("input", render);
$("tpl").value = st.tpl;
$("tpl").addEventListener("input", () => { st.tpl = $("tpl").value; save(); render(); });
$("resetTpl").onclick = () => { st.tpl = DEFAULT_TPL; $("tpl").value = DEFAULT_TPL; save(); render(); };
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(pw){
  const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(ENC.salt), iterations:ENC.iter, hash:"SHA-256"}, km, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(ENC.iv)}, key, b64(ENC.ct));
  DATA = JSON.parse(new TextDecoder().decode(plain));
  $("lock").remove(); render();
}
$("lockForm").addEventListener("submit", async e => {
  e.preventDefault(); $("pwErr").textContent = "בודק…";
  const pw = $("pw").value;
  try { await unlock(pw); try { localStorage.setItem(KEY+"-pw", pw); } catch(_){} }
  catch(err){ $("pwErr").textContent = "סיסמה שגויה"; }
});
(async () => { let pw = null; try { pw = localStorage.getItem(KEY+"-pw"); } catch(_){}
  if (pw) { try { await unlock(pw); } catch(_){} } })();
</script>
